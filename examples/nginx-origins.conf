# Include within nginx's http {}. Configure certificates and real hostnames.
# Grant alice.* and bob.* to independent publishers.
limit_req_zone $binary_remote_addr zone=store_reads:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=store_api:10m rate=10r/s;

server {
    listen 443 ssl;
    server_name alice.apps.example.org;
    ssl_certificate /etc/nginx/certs/apps.example.org.crt;
    ssl_certificate_key /etc/nginx/certs/apps.example.org.key;
    root /var/lib/skrynia/store;
    add_header X-Content-Type-Options nosniff always;
    # Mutable keys can change faster than a static server's mtime ETag.
    # Serve fresh bytes when clients derive SHA-256 preconditions.
    etag off;
    add_header Cache-Control "no-store" always;

    location = / {
        limit_req zone=store_reads burst=60 nodelay;
        default_type text/html;
        try_files /alice.index.html =404;
    }
    location ~ ^/(?<alice_asset>[A-Za-z0-9_][A-Za-z0-9_.]*)$ {
        limit_req zone=store_reads burst=60 nodelay;
        try_files /alice.$alice_asset =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name bob.apps.example.org;
    ssl_certificate /etc/nginx/certs/apps.example.org.crt;
    ssl_certificate_key /etc/nginx/certs/apps.example.org.key;
    root /var/lib/skrynia/store;
    add_header X-Content-Type-Options nosniff always;
    # Mutable keys can change faster than a static server's mtime ETag.
    # Serve fresh bytes when clients derive SHA-256 preconditions.
    etag off;
    add_header Cache-Control "no-store" always;

    location = / {
        limit_req zone=store_reads burst=60 nodelay;
        default_type text/html;
        try_files /bob.index.html =404;
    }
    location ~ ^/(?<bob_asset>[A-Za-z0-9_][A-Za-z0-9_.]*)$ {
        limit_req zone=store_reads burst=60 nodelay;
        try_files /bob.$bob_asset =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name api.apps.example.org;
    ssl_certificate /etc/nginx/certs/apps.example.org.crt;
    ssl_certificate_key /etc/nginx/certs/apps.example.org.key;

    location / {
        limit_req zone=store_api burst=40 nodelay;
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:17380;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
