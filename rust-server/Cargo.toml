[package]
name = "skrynia-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"

[dependencies]
axum = "0.8"
wasmtime = { version = "27", default-features = false, features = ["cranelift", "runtime"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
sha2 = "0.10"
rand = "0.9"
libc = "0.2"
futures-util = "0.3"
[dev-dependencies]
wat = "1"
tokio = { version = "1", features = ["full", "test-util"] }

tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[bin]]
name = "compile_worker"
path = "src/boot/vm/compile/bin_main.rs"

[[test]]
name = "vm"
path = "tests/vm/mod.rs"

[[test]]
name = "http"
path = "tests/http/mod.rs"
