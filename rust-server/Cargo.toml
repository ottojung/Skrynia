[package]
name = "skrynia-server"
version = "0.3.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"

[dependencies]
axum = "0.8"
wasmtime = { version = "27", default-features = false, features = ["cranelift", "runtime"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
wat = "1"
tower = { version = "0.5", features = ["util"] }
