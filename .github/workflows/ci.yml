name: CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: make test

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive build version
        id: gitver
        shell: bash
        run: |
          VERSION="$(git describe --always | sed 's/^v//')"
          COMMIT="$(git rev-parse HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push Skrynia
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: ${{ github.ref != 'refs/heads/main' }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/ottojung/skrynia:${{ steps.gitver.outputs.version }}
            ghcr.io/ottojung/skrynia:latest
          build-args: |
            SKRYNIA_VERSION=${{ steps.gitver.outputs.version }}
            SKRYNIA_COMMIT=${{ steps.gitver.outputs.commit }}
          cache-from: type=gha,scope=docker-skrynia
          cache-to: type=gha,mode=max,scope=docker-skrynia
      - name: Pull image for smoke test
        if: github.ref == 'refs/heads/main'
        run: docker pull ghcr.io/ottojung/skrynia:latest
      - name: Smoke test HTTP and root bootstrap
        run: |
          docker rm -f skrynia-smoke >/dev/null 2>&1 || true
          docker run -d --name skrynia-smoke \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /var/lib/skrynia \
            --network host \
            --env SKRYNIA_URL=http://127.0.0.1:17380/platform \
            ghcr.io/ottojung/skrynia:latest
          trap 'docker rm -f skrynia-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:17380/platform/health && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:17380/platform/version | grep -F '"commit":"${{ steps.gitver.outputs.commit }}"'
          docker exec skrynia-smoke node /app/scripts/root-credentials.js | grep '"issuerToken"'
          docker exec skrynia-smoke node -e '
            const fs=require("fs"),p="/var/lib/skrynia/state/grants";
            const x=fs.readdirSync(p).map(n=>JSON.parse(fs.readFileSync(p+"/"+n)));
            if(x.length!==1||x[0].parent!==null||x[0].maxBytes!==null)process.exit(1);
          '
