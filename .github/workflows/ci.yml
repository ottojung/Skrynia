name: CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:
    inputs:
      publish:
        description: "Explicitly publish the independently qualified main image"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Rust verification
        run: make test
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Derive build identity
        id: version
        shell: bash
        run: |
          VERSION="$(git describe --always | sed 's/^v//')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: skrynia:ci
          build-args: |
            SKRYNIA_VERSION=${{ steps.version.outputs.version }}
            SKRYNIA_COMMIT=${{ steps.version.outputs.commit }}
          cache-from: type=gha,scope=skrynia
          cache-to: type=gha,mode=max,scope=skrynia
      # Test a disposable operator-supplied WASM fixture, not a built-in
      # Program0 or any production token. The generic kernel has POST / only.
      - name: Verify external root startup and POST-only VM
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq wabt
          wat2wasm rust-server/test-fixtures/stream_early_output.wat -o ci-root.wasm
          set +e
          docker run --rm skrynia:ci > /tmp/skrynia-no-root.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'SKRYNIA_ROOT_WASM is required' /tmp/skrynia-no-root.log
          docker rm -f skrynia-test >/dev/null 2>&1 || true
          docker run --rm -d --name skrynia-test \
            --read-only --tmpfs /tmp \
            --tmpfs /var/lib/skrynia/operator:uid=1000,gid=1000,mode=0700 \
            --tmpfs /var/lib/skrynia/user:uid=1000,gid=1000,mode=0700 \
            -v "$PWD/ci-root.wasm:/etc/skrynia-test-root.wasm:ro" \
            -p 127.0.0.1:17380:17380 \
            -e SKRYNIA_ROOT_WASM=/etc/skrynia-test-root.wasm \
            skrynia:ci
          trap 'docker stop -t 5 skrynia-test >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 50); do
            if test "$(curl -fsS --max-time 1 -X POST \
              --data-binary 'ping' http://127.0.0.1:17380/ 2>/dev/null || true)" = AB; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" = 1
          test "$(docker exec skrynia-test id -u)" = 1000
          test "$(docker exec skrynia-test stat -c '%a' /var/lib/skrynia)" = 700
          test "$(docker exec skrynia-test stat -c '%a' /var/lib/skrynia/operator)" = 700
          test "$(docker exec skrynia-test stat -c '%a' /var/lib/skrynia/user)" = 700
          test "$(docker exec skrynia-test stat -c '%d' /var/lib/skrynia/operator)" != \
            "$(docker exec skrynia-test stat -c '%d' /var/lib/skrynia/user)"
          status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:17380/)"
          test "$status" = 404
          test "$(docker inspect --format '{{.Image}}' skrynia-test)" = \
            "$(docker image inspect --format '{{.Id}}' skrynia:ci)"
      - name: Log in to registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish == true
        run: |
          docker tag skrynia:ci ghcr.io/ottojung/skrynia:sha-${{ steps.version.outputs.commit }}
          docker push ghcr.io/ottojung/skrynia:sha-${{ steps.version.outputs.commit }}
          docker tag skrynia:ci ghcr.io/ottojung/skrynia:${{ steps.version.outputs.version }}
          docker push ghcr.io/ottojung/skrynia:${{ steps.version.outputs.version }}
          docker tag skrynia:ci ghcr.io/ottojung/skrynia:latest
          docker push ghcr.io/ottojung/skrynia:latest
