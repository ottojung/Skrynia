name: CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Rust verification
        run: make test
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Derive build identity
        id: version
        shell: bash
        run: |
          VERSION="$(git describe --always | sed 's/^v//')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: skrynia:ci
          build-args: |
            SKRYNIA_VERSION=${{ steps.version.outputs.version }}
            SKRYNIA_COMMIT=${{ steps.version.outputs.commit }}
          cache-from: type=gha,scope=skrynia
          cache-to: type=gha,mode=max,scope=skrynia
      - name: Verify startup, credentials and build identity
        run: |
          docker rm -f skrynia-test >/dev/null 2>&1 || true
          docker run --rm -d --name skrynia-test \
            --read-only --tmpfs /tmp \
            --tmpfs /var/lib/skrynia:uid=1000,gid=1000,mode=0700 \
            -p 127.0.0.1:17380:17380 \
            -e SKRYNIA_URL=http://127.0.0.1:17380/platform skrynia:ci
          trap 'docker stop -t 5 skrynia-test >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:17380/platform/health >/dev/null; then ready=1; break; fi
            sleep 0.2
          done
          test "$ready" = 1
          test "$(docker exec skrynia-test id -u)" = 1000
          docker exec skrynia-test skrynia-server root-credentials >/dev/null
          curl -fsS http://127.0.0.1:17380/platform/version | grep -F '"commit":"${{ steps.version.outputs.commit }}"'
      - name: Verify isolated public publisher origins
        run: |
          set -eu
          tmp="$(mktemp -d)"
          trap 'docker rm -f skrynia-static >/dev/null 2>&1 || true; rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/certs" "$tmp/store" "$tmp/private"
          openssl req -newkey rsa:2048 -nodes -x509 -days 1 \
            -subj /CN=apps.example.org \
            -keyout "$tmp/certs/apps.example.org.key" \
            -out "$tmp/certs/apps.example.org.crt" >/dev/null 2>&1
          printf Alice > "$tmp/store/alice.index.html"
          printf Bob > "$tmp/store/bob.index.html"
          printf secret > "$tmp/private/key"
          printf cross > "$tmp/store/bob.secret.txt"
          ln -s ../state/key "$tmp/store/alice.leak"
          ln -s bob.secret.txt "$tmp/store/alice.cross"
          docker run --rm -d --name skrynia-static \
            -p 127.0.0.1:17443:443 \
            -v "$PWD/examples/nginx-origins.conf:/etc/nginx/conf.d/skrynia.conf:ro" \
            -v "$tmp/certs:/etc/nginx/certs:ro" \
            -v "$tmp/store:/var/lib/skrynia/store:ro" \
            -v "$tmp/private:/var/lib/skrynia/state:ro" nginx:stable
          for i in $(seq 1 50); do
            if curl -kfsS --noproxy '*' \
              --resolve alice.apps.example.org:17443:127.0.0.1 \
              https://alice.apps.example.org:17443/ >/dev/null; then break; fi
            sleep 0.2
          done
          test "$(curl -kfsS --noproxy '*' \
            --resolve alice.apps.example.org:17443:127.0.0.1 \
            https://alice.apps.example.org:17443/)" = Alice
          test "$(curl -kfsS --noproxy '*' \
            --resolve bob.apps.example.org:17443:127.0.0.1 \
            https://bob.apps.example.org:17443/)" = Bob
          test "$(curl -k -sS --noproxy '*' -o /dev/null -w '%{http_code}' \
            --resolve alice.apps.example.org:17443:127.0.0.1 \
            https://alice.apps.example.org:17443/bob.index.html)" = 404
          test "$(curl -k -sS --noproxy '*' -o /dev/null -w '%{http_code}' \
            --resolve alice.apps.example.org:17443:127.0.0.1 \
            https://alice.apps.example.org:17443/leak)" != 200
          test "$(curl -k -sS --noproxy '*' -o /dev/null -w '%{http_code}' \
            --resolve alice.apps.example.org:17443:127.0.0.1 \
            https://alice.apps.example.org:17443/cross)" != 200
      - name: Log in to registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag skrynia:ci ghcr.io/ottojung/skrynia:sha-${{ steps.version.outputs.commit }}
          docker push ghcr.io/ottojung/skrynia:sha-${{ steps.version.outputs.commit }}
          docker tag skrynia:ci ghcr.io/ottojung/skrynia:${{ steps.version.outputs.version }}
          docker push ghcr.io/ottojung/skrynia:${{ steps.version.outputs.version }}
          docker tag skrynia:ci ghcr.io/ottojung/skrynia:latest
          docker push ghcr.io/ottojung/skrynia:latest
