name: Rust verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format, tests, structural lint and strict Clippy
        run: make test
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Rust container
        run: docker build -t skrynia:ci --build-arg SKRYNIA_VERSION=0.3.0 --build-arg SKRYNIA_COMMIT=${{ github.sha }} .
      - name: Check HTTP startup and non-root execution
        run: |
          docker run --rm -d --name skrynia-check -p 127.0.0.1:38912:17380 \
            -e SKRYNIA_URL=http://127.0.0.1:38912/base skrynia:ci
          trap 'docker stop skrynia-check >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:38912/base/health >/dev/null; then ready=1; break; fi
            sleep 0.2
          done
          test "$ready" = 1
          test "$(docker exec skrynia-check id -u)" = 1000
          docker exec skrynia-check skrynia-server root-credentials >/dev/null
          curl --fail --silent http://127.0.0.1:38912/base/version | grep -F "${{ github.sha }}"
