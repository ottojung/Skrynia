name: Rust preview
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Default Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust unit tests
        run: cargo test --locked --all-targets
      - name: Ivanka-compatible structural linter
        run: |
          rustc --test rust-server/source_lints/mod.rs -o "${RUNNER_TEMP}/skrynia-lints"
          "${RUNNER_TEMP}/skrynia-lints"
      - name: Strict Clippy
        run: cargo clippy --locked --all-targets -- -D clippy::correctness -D clippy::suspicious -D clippy::perf -D clippy::complexity
      - name: Rust + Node on-disk/API interoperability
        run: |
          cargo build --locked --package skrynia-server
          node tests/rust-server-smoke.js
          node tests/rust-protocol-parity.js

  container-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated Rust preview image
        run: docker build --file Dockerfile.rust --tag skrynia-rust-preview .
      - name: Verify non-root startup and graceful SIGTERM
        run: |
          docker run --rm -d --name skrynia-rust-check \
            -p 127.0.0.1:38912:17380 \
            -e SKRYNIA_URL=http://127.0.0.1:38912/base \
            skrynia-rust-preview
          trap 'docker stop -t 5 skrynia-rust-check >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:38912/base/health > /dev/null; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" = 1 || { docker logs skrynia-rust-check; exit 1; }
          test "$(docker exec skrynia-rust-check id -u)" = 1000
          timeout 8s docker stop -t 5 skrynia-rust-check > /dev/null
